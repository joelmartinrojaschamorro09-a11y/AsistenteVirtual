<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EstudiaBot – Asistente virtual universitario</title>
<style>
  /* ===== ESTILOS GENERALES ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #1e3a5f, #2c7a7b);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .chat {
    width: 100%; max-width: 480px; height: 90vh; max-height: 720px;
    background: #fff; border-radius: 18px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
  }
  /* Encabezado */
  .encabezado {
    background: #1e3a5f; color: #fff; padding: 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: #38b2ac; display: grid; place-items: center; font-size: 24px;
  }
  .encabezado h1 { font-size: 18px; }
  .encabezado p { font-size: 12px; opacity: .8; }
  /* Zona de mensajes */
  .mensajes {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px; background: #f4f7fa;
  }
  .msg {
    max-width: 80%; padding: 10px 14px; border-radius: 14px;
    font-size: 14px; line-height: 1.45; white-space: pre-line;
    animation: aparecer .25s ease;
  }
  .bot { background: #fff; color: #1a202c; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .usuario { background: #2c7a7b; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  @keyframes aparecer { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  /* Botones de sugerencias */
  .sugerencias { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; background: #f4f7fa; border-top: 1px solid #e2e8f0; }
  .sugerencias button {
    border: 1px solid #2c7a7b; background: #fff; color: #2c7a7b;
    border-radius: 20px; padding: 5px 12px; font-size: 12px; cursor: pointer;
  }
  .sugerencias button:hover { background: #2c7a7b; color: #fff; }
  /* Barra para escribir */
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e2e8f0; }
  input {
    flex: 1; padding: 10px 14px; border: 1px solid #cbd5e0;
    border-radius: 24px; font-size: 14px; outline: none;
  }
  input:focus { border-color: #2c7a7b; }
  form button {
    background: #2c7a7b; color: #fff; border: none;
    border-radius: 24px; padding: 0 18px; cursor: pointer; font-weight: 600;
  }
</style>
</head>
<body>

<div class="chat">
  <div class="encabezado">
    <div class="avatar">🎓</div>
    <div>
      <h1>EstudiaBot</h1>
      <p>Asistente virtual para estudiantes universitarios</p>
    </div>
  </div>

  <div class="mensajes" id="mensajes"></div>

  <div class="sugerencias" id="sugerencias"></div>

  <form id="formulario">
    <input id="entrada" type="text" placeholder="Escribe tu pregunta..." autocomplete="off">
    <button type="submit">Enviar</button>
  </form>
</div>

<script>
/* =========================================================
   1. BASE DE CONOCIMIENTO
   Cada tema tiene:
   - palabras: palabras clave que activan la respuesta
   - respuesta: lo que contesta el asistente
   ========================================================= */
const temas = [
  {
    palabras: ["hola", "buenas", "buenos dias", "buenas tardes", "hey"],
    respuesta: "¡Hola! 👋 Soy EstudiaBot. Puedo ayudarte con técnicas de estudio, organización del tiempo, normas APA, derivadas básicas y conceptos de programación. ¿Qué necesitas?"
  },
  {
    palabras: ["pomodoro"],
    respuesta: "🍅 Técnica Pomodoro:\n1. Estudia 25 minutos sin distracciones.\n2. Descansa 5 minutos.\n3. Repite 4 veces.\n4. Después toma un descanso largo de 15 a 30 minutos.\nAyuda a mantener la concentración y a no cansarte tan rápido."
  },
  {
    palabras: ["estudiar", "estudio", "tecnica", "concentrar", "memorizar"],
    respuesta: "📚 Técnicas de estudio recomendadas:\n• Pomodoro: bloques de 25 min con descansos.\n• Repaso espaciado: repasa el tema al día siguiente, a los 3 días y a la semana.\n• Autoevaluación: hazte preguntas en vez de solo releer.\n• Técnica Feynman: explica el tema como si se lo enseñaras a un niño.\nEscribe \"pomodoro\" si quieres más detalle."
  },
  {
    palabras: ["tiempo", "organizar", "horario", "agenda", "planificar"],
    respuesta: "🗓️ Para organizar tu tiempo:\n1. Anota todas las entregas y parciales en una agenda o calendario.\n2. Divide los trabajos grandes en tareas pequeñas.\n3. Usa la matriz de Eisenhower: urgente/importante primero.\n4. Reserva horas fijas de estudio cada día, como si fueran clases."
  },
  {
    palabras: ["apa", "citar", "cita", "referencia", "bibliografia"],
    respuesta: "📝 Normas APA (7.ª edición) – lo básico:\n• Cita en el texto: (Apellido, año). Ejemplo: (García, 2021).\n• Referencia de libro: Apellido, N. (Año). Título del libro en cursiva. Editorial.\n• Referencia web: Apellido, N. (Año, día mes). Título. Sitio web. URL\n• Letra: Times New Roman 12 o Calibri 11, interlineado doble."
  },
  {
    palabras: ["derivada", "derivar", "calculo"],
    respuesta: "📐 Reglas básicas de derivación:\n• Constante: (c)' = 0\n• Potencia: (xⁿ)' = n·xⁿ⁻¹\n• Suma: (f + g)' = f' + g'\n• Producto: (f·g)' = f'·g + f·g'\n• Cociente: (f/g)' = (f'·g − f·g') / g²\n• Regla de la cadena: f(g(x))' = f'(g(x))·g'(x)\nEjemplo: (3x²)' = 6x"
  },
  {
    palabras: ["variable"],
    respuesta: "💻 Una variable es un espacio en memoria con un nombre, donde se guarda un dato que puede cambiar.\nEjemplo en JavaScript:\nlet edad = 18;\nedad = 19; // cambió su valor"
  },
  {
    palabras: ["bucle", "ciclo", "repetir"],
    respuesta: "🔁 Un bucle repite instrucciones varias veces.\n• for: cuando sabes cuántas veces repetir.\n   for (let i = 1; i <= 5; i++) { console.log(i); }\n• while: mientras se cumpla una condición.\n   while (saldo > 0) { saldo--; }"
  },
  {
    palabras: ["funcion"],
    respuesta: "⚙️ Una función es un bloque de código reutilizable que hace una tarea.\nEjemplo:\nfunction sumar(a, b) {\n  return a + b;\n}\nsumar(2, 3); // devuelve 5"
  },
  {
    palabras: ["programar", "programacion", "codigo", "lenguaje"],
    respuesta: "👨‍💻 Para empezar a programar:\n1. Aprende lógica: variables, condicionales, bucles y funciones.\n2. Elige un lenguaje inicial: Python o JavaScript son buenos.\n3. Practica todos los días con ejercicios pequeños.\nPregúntame por \"variable\", \"bucle\" o \"función\"."
  },
  {
    palabras: ["estres", "ansiedad", "cansado", "motivacion", "desmotivado"],
    respuesta: "💙 Es normal sentirse así en la universidad. Algunos consejos:\n• Duerme entre 7 y 8 horas.\n• Haz pausas activas y algo de ejercicio.\n• No dejes todo para el final.\n• Habla con compañeros, profesores o con Bienestar Universitario si lo necesitas."
  },
  {
    palabras: ["gracias", "muchas gracias", "chao", "adios"],
    respuesta: "¡Con gusto! 😊 Mucho éxito en tus estudios. Vuelve cuando quieras."
  }
];

// Respuesta cuando el asistente no entiende
const respuestaPorDefecto =
  "🤔 No entendí bien tu pregunta. Puedo ayudarte con:\n• Técnicas de estudio\n• Organización del tiempo\n• Normas APA\n• Derivadas\n• Programación (variable, bucle, función)";

// Botones de preguntas rápidas
const preguntasRapidas = ["¿Cómo estudiar mejor?", "Técnica Pomodoro", "Normas APA", "Reglas de derivadas", "¿Qué es una función?"];

/* =========================================================
   2. FUNCIONES DEL ASISTENTE
   ========================================================= */

// Quita tildes y pasa a minúsculas para comparar mejor
function normalizar(texto) {
  return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

// Busca qué tema coincide con lo que escribió el usuario
function obtenerRespuesta(mensaje) {
  const texto = normalizar(mensaje);
  for (const tema of temas) {
    for (const palabra of tema.palabras) {
      // Busca la palabra completa (acepta plural: "derivadas", "funciones")
      const patron = new RegExp("\\b" + palabra + "(s|es)?\\b");
      if (patron.test(texto)) {
        return tema.respuesta;
      }
    }
  }
  return respuestaPorDefecto;
}

// Muestra un mensaje en pantalla
function agregarMensaje(texto, quien) {
  const caja = document.getElementById("mensajes");
  const div = document.createElement("div");
  div.className = "msg " + quien;   // "bot" o "usuario"
  div.textContent = texto;
  caja.appendChild(div);
  caja.scrollTop = caja.scrollHeight; // baja al último mensaje
}

// Procesa lo que envía el usuario
function enviar(mensaje) {
  if (mensaje.trim() === "") return;
  agregarMensaje(mensaje, "usuario");
  // Pequeña espera para que parezca que "piensa"
  setTimeout(() => agregarMensaje(obtenerRespuesta(mensaje), "bot"), 500);
}

/* =========================================================
   3. EVENTOS (lo que pasa al hacer clic o enviar)
   ========================================================= */
document.getElementById("formulario").addEventListener("submit", (e) => {
  e.preventDefault();               // evita que la página se recargue
  const entrada = document.getElementById("entrada");
  enviar(entrada.value);
  entrada.value = "";
});

// Crear los botones de sugerencias
const zonaSugerencias = document.getElementById("sugerencias");
preguntasRapidas.forEach((pregunta) => {
  const boton = document.createElement("button");
  boton.textContent = pregunta;
  boton.addEventListener("click", () => enviar(pregunta));
  zonaSugerencias.appendChild(boton);
});

// Mensaje de bienvenida
agregarMensaje("¡Hola! 👋 Soy EstudiaBot, tu asistente universitario. Pregúntame sobre técnicas de estudio, APA, derivadas o programación.", "bot");
</script>
</body>
</html>
